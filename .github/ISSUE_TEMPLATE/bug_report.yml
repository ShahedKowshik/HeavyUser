name: Bug report
description: Report an unexpected behavior in HeavyUser without including private account data.
title: "Bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Never include passwords, access tokens, private habit records, or other sensitive personal data. For vulnerabilities use SECURITY.md, not public Issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in plain language.
      placeholder: "After undoing a completed check-off, the calendar still showed it as done."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reproduces the issue.
      placeholder: "1. Create a check-off habit\n2. Complete it for today\n3. Undo\n4. Check Insights"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome desktop / Safari iPhone / etc."
  - type: textarea
    id: context
    attributes:
      label: Other context (optional)
      description: Share redacted screenshots, habit tracking method, relevant dates, and whether an undo or historical edit was involved.
