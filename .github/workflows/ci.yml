name: HeavyUser quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: heavyuser-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0
        with:
          version: 11.9.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository preflight
        run: pnpm preflight
      - name: Check declared change scope
        env:
          HEAVYUSER_SCOPE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: pnpm check:scope
      - name: Check generated-file baseline
        run: pnpm check:generated
      - name: Check release evidence declaration
        run: pnpm check:release
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium for browser QA
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser journeys
        run: pnpm test:e2e
      - name: Recheck generated-file baseline
        run: pnpm check:generated
      - name: Dependency audit
        run: pnpm audit
      - name: Production dependency audit
        run: pnpm audit --prod
      - name: Keep Chrome QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heavyuser-chrome-qa
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  database:
    name: Database checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@2b65cf0aa3867ec8426b3adf8f2df81844aee6d0 # v1.0.0
        with:
          version: 2.111.0
      - name: Start local database
        run: supabase start
      - name: Lint database schema
        run: supabase db lint --local
      - name: Run database security tests
        run: supabase test db --local supabase/tests/database
      - name: Stop local database
        if: always()
        run: supabase stop

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
